<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeakIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #A2D9FF;
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        #score-board {
            text-align: center;
            padding-top: 50px;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 60px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #void-warning {
            text-align: center;
            color: #FF6B6B;
            font-size: 18px;
            font-weight: bold;
            margin-top: -10px;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* --- MENU SCREEN --- */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.3) 100%);
            pointer-events: auto;
            z-index: 100;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-header {
            position: absolute;
            top: 60px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 102;
        }

        h1 {
            color: #ffffff;
            font-family: 'Fredoka One', cursive;
            font-size: 80px;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0 #FF9F43;
            -webkit-text-stroke: 3px #FF9F43;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* Leaderboard Kiri */
        .left-panel {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            max-width: 40%;
            z-index: 101;
            pointer-events: auto;
        }

        /* Panel Kanan */
        .right-panel {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 101;
            pointer-events: auto;
        }

        .hall-of-hell {
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid #fff;
            border-radius: 20px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }

        .leaderboard-title {
            color: #fff;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            margin-bottom: 5px;
            font-size: 18px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
            border-bottom: 2px solid rgba(255,255,255,0.5);
            padding-bottom: 5px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            color: white;
            padding: 5px 8px;
            margin-bottom: 3px;
            border-radius: 8px;
            background: rgba(0,0,0,0.1);
            font-size: 13px;
            font-weight: bold;
        }
        
        .rank-item .score { color: #FFD700; }
        .rank-1 { color: #FFD700 !important; }
        .rank-2 { color: #E0E0E0 !important; }
        .rank-3 { color: #CD7F32 !important; }

        /* Input Styling */
        input[type="text"] {
            padding: 10px 15px;
            font-size: 20px;
            border-radius: 15px;
            border: 3px solid #fff;
            background: rgba(255,255,255,0.9);
            color: #333;
            text-align: center;
            outline: none;
            width: 100%;
            font-family: 'Fredoka One', cursive;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            pointer-events: auto;
        }

        /* Name Display */
        .name-display-container {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
            pointer-events: none;
        }

        .player-name-text {
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            display: inline-block;
        }

        .edit-btn {
            font-size: 12px;
            color: #eee;
            text-decoration: underline;
            cursor: pointer;
            pointer-events: auto;
            margin-top: 5px;
            display: block;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 10px;
            width: fit-content;
            margin-left: auto; 
            margin-right: auto;
        }

        /* Tombol Start */
        button {
            background-color: #2ECC71; 
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 28px;
            font-family: 'Fredoka One', cursive;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 0 #27AE60;
            transition: transform 0.1s, top 0.1s;
            width: 100%;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            position: relative;
            animation: pulse 1.5s infinite;
            pointer-events: auto;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button:active { 
            transform: translateY(8px) scale(1) !important;
            box-shadow: 0 0 0 #27AE60; 
            animation: none;
        }
        
        button:disabled { 
            background-color: #95a5a6; 
            box-shadow: 0 8px 0 #7f8c8d; 
            cursor: not-allowed; 
            animation: none;
            opacity: 0.8;
        }

        .hidden { display: none !important; }

        /* Controls */
        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            display: flex;
            z-index: 50;
            pointer-events: auto;
        }
        .touch-btn { flex: 1; }
        
        #hints {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        #db-status {
            font-size: 12px;
            color: white;
            margin-top: 10px;
            text-align: center;
            width: 100%;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        #tap-to-start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
            cursor: pointer;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .menu-header { top: 40px; }
            h1 { font-size: 50px; }
            
            .left-panel {
                top: 130px;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 320px;
                bottom: auto;
            }
            .hall-of-hell { max-height: 120px; }
            
            .right-panel {
                top: auto;
                bottom: 40px;
                right: 50%;
                transform: translateX(50%);
                width: 90%;
                max-width: 320px;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="score-board" class="hidden">0</div>
        <div id="void-warning">AWAS JURANG!</div>
        <div id="hints" class="hidden">Tap KIRI / KANAN</div>
    </div>

    <div id="touch-controls">
        <div class="touch-btn" id="btn-left"></div>
        <div class="touch-btn" id="btn-right"></div>
    </div>

    <!-- Menu -->
    <div id="menu-screen">
        <!-- Tap Area -->
        <div id="tap-to-start-overlay"></div>

        <div class="menu-header">
            <h1 id="title-text">PeakIN</h1>
        </div>

        <div class="left-panel">
            <div class="hall-of-hell">
                <div class="leaderboard-title">👑 Top Climbers</div>
                <div id="leaderboard-list">
                    <div style="text-align:center; padding: 10px; color:#eee;">Memuat...</div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            
            <!-- INPUT NAME MODE -->
            <div id="input-mode-container">
                <input type="text" id="username-input" placeholder="Nama Kamu" maxlength="12" autocomplete="off">
                <div id="name-status"></div>
            </div>

            <!-- DISPLAY NAME MODE -->
            <div id="display-mode-container" class="hidden name-display-container">
                <div class="player-name-text" id="player-name-display">PLAYER</div>
                <div class="edit-btn" id="edit-name-btn">Ganti Nama</div>
            </div>

            <button id="start-btn" disabled>MASUKKAN NAMA</button>
            <div id="db-status">Menghubungkan...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDwAEwVTJwhJNrDWqf-i_-z3PF3M6dDuxk",
            authDomain: "team-peak-61640.firebaseapp.com",
            projectId: "team-peak-61640",
            storageBucket: "team-peak-61640.firebasestorage.app",
            messagingSenderId: "616363864083",
            appId: "1:616363864083:web:b79b8cf941bc9e0bdacfe6",
            measurementId: "G-XN6SE6K0RZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'team-peak-61640'; 
        
        let currentUser = null;
        let playerName = localStorage.getItem('voxelPeakName') || "";
        let isOfflineMode = false;

        // --- CONFIG ---
        const CONFIG = {
            cubeSize: 10,
            jumpDuration: 0.15,
            jumpHeight: 8,
            baseVoidSpeed: 2.0, 
            voidSpeedMultiplier: 0.2, 
            renderDistance: 25, 
            colors: { bg: 0xA2D9FF, player: 0xFFFFFF, void: 0x220044, cloud: 0xFFFFFF }
        };

        // --- GLOBALS ---
        let scene, camera, renderer;
        let player;
        let voidMesh; 
        let map = new Map(); 
        let fallingBlocks = []; 
        let clouds = []; 
        let particles = []; 
        let bgParticles = []; 
        let animationId;
        
        let gameState = {
            isPlaying: false,
            isJumping: false,
            score: 0,
            highScore: 0, 
            playerPos: { x: 0, y: 0, z: 0 },
            maxRowGenerated: 0,
            voidY: -50, 
            currentVoidSpeed: 0,
            failedMove: false
        };

        let jumpStartPos = new THREE.Vector3();
        let jumpTargetPos = new THREE.Vector3();
        let jumpStartTime = 0;
        let lastTime = 0;
        let lastInputTime = 0; 

        // Elements
        const scoreEl = document.getElementById('score-board');
        const voidWarningEl = document.getElementById('void-warning');
        const menuScreen = document.getElementById('menu-screen');
        const startBtn = document.getElementById('start-btn');
        const dbStatus = document.getElementById('db-status');
        
        const inputContainer = document.getElementById('input-mode-container');
        const displayContainer = document.getElementById('display-mode-container');
        const nameInput = document.getElementById('username-input');
        const nameDisplay = document.getElementById('player-name-display');
        const editBtn = document.getElementById('edit-name-btn');
        const nameStatus = document.getElementById('name-status');
        
        const leaderboardList = document.getElementById('leaderboard-list');
        const hintsEl = document.getElementById('hints');
        const tapOverlay = document.getElementById('tap-to-start-overlay');

        // Init
        nameInput.value = playerName;
        if(playerName) {
            setTimeout(() => nameInput.dispatchEvent(new Event('input')), 500);
        }
        
        initGame();
        initAuth();

        // --- UI LOGIC ---
        
        function switchMode(isEditing) {
            if (isEditing) {
                inputContainer.classList.remove('hidden');
                displayContainer.classList.add('hidden');
                nameInput.focus();
                startBtn.innerText = "CEK NAMA...";
                startBtn.disabled = true;
            } else {
                inputContainer.classList.add('hidden');
                displayContainer.classList.remove('hidden');
                nameDisplay.innerText = playerName;
                startBtn.innerText = "TAP TO START";
                startBtn.disabled = false;
                nameInput.blur();
            }
        }

        editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            switchMode(true);
        });

        // VALIDASI NAMA
        let typingTimer;
        nameInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            const val = nameInput.value.trim().toUpperCase();
            
            if (val.length < 3) {
                nameStatus.innerText = "Min 3 huruf";
                nameStatus.className = "status-error";
                startBtn.disabled = true;
                return;
            }

            nameStatus.innerText = "Cek nama...";
            nameStatus.className = "status-checking";
            
            typingTimer = setTimeout(() => validateName(val), 600);
        });

        async function validateName(nameToCheck) {
            playerName = nameToCheck;
            localStorage.setItem('voxelPeakName', playerName);

            if(!currentUser) {
                switchMode(false);
                return;
            }

            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'), where("name", "==", nameToCheck));
            
            try {
                const querySnapshot = await getDocs(q);
                let isTaken = false;
                
                if (!querySnapshot.empty) {
                    querySnapshot.forEach((doc) => {
                        if (currentUser && doc.id !== currentUser.uid) isTaken = true;
                    });
                }

                if (isTaken) {
                    nameStatus.innerText = "Nama pasaran! (Gas aja)";
                    nameStatus.className = "status-warn";
                } else {
                    nameStatus.innerText = "Nama Unik ✅";
                    nameStatus.className = "status-ok";
                }
                
                switchMode(false);

            } catch (err) {
                console.error("Name check error", err);
                switchMode(false);
            }
        }

        // --- AUTH & DB ---
        async function initAuth() {
            try { await signInAnonymously(auth); } 
            catch (e) { 
                console.error(e); 
                dbStatus.innerText = "Offline Mode"; 
                isOfflineMode = true;
                if(nameInput.value.length >= 3) switchMode(false);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    dbStatus.innerText = "Online 🟢";
                    isOfflineMode = false;
                    subscribeToLeaderboard(); 
                    loadPersonalStats(user.uid);
                    if(nameInput.value.length >= 3) validateName(nameInput.value.trim().toUpperCase());
                } else {
                    isOfflineMode = true;
                }
            });
        }

        function subscribeToLeaderboard() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            onSnapshot(colRef, (snapshot) => {
                let data = [];
                snapshot.forEach(doc => { data.push(doc.data()); });
                data.sort((a, b) => b.score - a.score);
                renderLeaderboard(data.slice(0, 50));
            }, (error) => {
                if(error.code === 'permission-denied') leaderboardList.innerHTML = "<div style='text-align:center; padding:10px; color:#ff9f43'>Cek Rules Firebase</div>";
            });
        }

        function renderLeaderboard(data) {
            leaderboardList.innerHTML = "";
            if (data.length === 0) {
                leaderboardList.innerHTML = "<div style='text-align:center; padding:10px; color:#eee'>Sepi...</div>";
                return;
            }
            data.forEach((entry, index) => {
                const rank = index + 1;
                let rankClass = "";
                if (rank === 1) rankClass = "rank-1";
                if (rank === 2) rankClass = "rank-2";
                if (rank === 3) rankClass = "rank-3";
                const isMe = entry.name === playerName ? "style='background:rgba(255,255,255,0.3)'" : "";
                const html = `<div class="rank-item" ${isMe}><div class="rank ${rankClass}">#${rank}</div><div class="name ${rankClass}">${entry.name}</div><div class="score">${entry.score}m</div></div>`;
                leaderboardList.innerHTML += html;
            });
        }

        function loadPersonalStats(userId) {
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'game_data', 'stats');
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) gameState.highScore = docSnap.data().highScore || 0;
            });
        }

        async function saveScoreToHell(finalScore) {
            localStorage.setItem('voxelPeakHighScore', Math.max(finalScore, localStorage.getItem('voxelPeakHighScore') || 0));

            if (!currentUser || isOfflineMode) return;

            if (finalScore > gameState.highScore) {
                const privateRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'game_data', 'stats');
                setDoc(privateRef, { highScore: finalScore }, { merge: true });
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUser.uid);
                try {
                    await setDoc(publicRef, { name: playerName, score: finalScore, updatedAt: Date.now() });
                } catch (e) { console.error(e); }
            }
        }

        // --- GAME ENGINE ---
        function cleanup() {
            if (animationId) cancelAnimationFrame(animationId);
            if (renderer) {
                renderer.dispose();
                const canvas = renderer.domElement;
                if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
                renderer = null; // Important: Clear ref
            }
        }

        function initGame() {
            cleanup(); 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xA2D9FF);
            scene.fog = new THREE.Fog(0xA2D9FF, 200, 600);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 80;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(100, 100, 100); 
            camera.lookAt(scene.position);

            try {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                const container = document.getElementById('game-container');
                if(container) {
                    container.innerHTML = ''; 
                    container.appendChild(renderer.domElement);
                }
            } catch (e) {
                console.error("WebGL Fail", e);
                dbStatus.innerText = "Error Grafik - Refresh Halaman";
                dbStatus.style.color = "red";
                return;
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createPlayerMesh();
            createVoidMesh();
            createBackgroundParticles();

            window.addEventListener('resize', onWindowResize);
            
            // START LOGIC
            const handleStart = (e) => {
                if(e) e.stopPropagation();
                if(!startBtn.disabled && !gameState.isPlaying) startGame();
            };

            startBtn.addEventListener('click', handleStart);
            startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, {passive: false});
            
            tapOverlay.addEventListener('click', handleStart);
            tapOverlay.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, {passive: false});

            // Input handlers
            nameInput.addEventListener('click', (e) => e.stopPropagation());
            nameInput.addEventListener('touchstart', (e) => e.stopPropagation());

            // GAME CONTROLS
            document.addEventListener('keydown', (e) => {
                resetIdleTimer();
                if (!gameState.isPlaying) return;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') movePlayer(-1);
                if (e.code === 'ArrowRight' || e.code === 'KeyD') movePlayer(1);
            });

            const handleTouch = (dir) => {
                resetIdleTimer();
                if (gameState.isPlaying) movePlayer(dir);
            };

            document.getElementById('btn-left').addEventListener('touchstart', (e) => { 
                if (e.cancelable) e.preventDefault(); 
                handleTouch(-1); 
            }, {passive: false});
            
            document.getElementById('btn-right').addEventListener('touchstart', (e) => { 
                if (e.cancelable) e.preventDefault(); 
                handleTouch(1); 
            }, {passive: false});

            document.getElementById('btn-left').addEventListener('mousedown', () => handleTouch(-1));
            document.getElementById('btn-right').addEventListener('mousedown', () => handleTouch(1));

            animate(0);
        }

        function resetIdleTimer() {
            lastInputTime = performance.now();
            if(player) player.rotation.y = 0; 
        }

        function createPlayerMesh() {
            const size = CONFIG.cubeSize * 0.6;
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({ color: CONFIG.colors.player });
            
            player = new THREE.Group();
            const body = new THREE.Mesh(geometry, material);
            body.position.y = size / 2;
            body.castShadow = true;
            player.add(body);

            const eyeGeo = new THREE.BoxGeometry(1.5, 1.5, 1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-1.5, size * 0.6, size/2);
            player.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(1.5, size * 0.6, size/2);
            player.add(rightEye);

            scene.add(player);
        }

        function createVoidMesh() {
            const geometry = new THREE.BoxGeometry(1000, 100, 1000); 
            const material = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.void, 
                transparent: true, 
                opacity: 0.8,
                roughness: 0.1
            });
            voidMesh = new THREE.Mesh(geometry, material);
            voidMesh.position.y = -100; 
            scene.add(voidMesh);
        }

        function createBackgroundParticles() {
            const count = 300;
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.4 });

            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 600,
                    (Math.random() - 0.5) * 600,
                    (Math.random() - 0.5) * 600
                );
                mesh.position.z -= 100; 
                group.add(mesh);
                bgParticles.push({
                    mesh: mesh,
                    speedY: Math.random() * 0.05 + 0.02,
                    speedRot: Math.random() * 0.02
                });
            }
            scene.add(group);
        }

        function createDust(x, y, z) {
            const count = 8;
            const geo = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xEEEEEE, transparent: true, opacity: 0.8 });
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                const velX = (Math.random() - 0.5) * 15;
                const velY = Math.random() * 10;
                const velZ = (Math.random() - 0.5) * 15;
                scene.add(mesh);
                particles.push({ mesh: mesh, vel: new THREE.Vector3(velX, velY, velZ), life: 1.0 });
            }
        }

        function createCloud(y, z) {
            const cloudGroup = new THREE.Group();
            const s = CONFIG.cubeSize;
            const chunks = Math.floor(Math.random() * 4) + 3;
            const geo = new THREE.BoxGeometry(s, s/2, s);
            const mat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.cloud, transparent: true, opacity: 0.7 });

            for(let i=0; i<chunks; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set((Math.random() - 0.5) * s * 3, (Math.random() - 0.5) * s * 0.8, (Math.random() - 0.5) * s * 2);
                cloudGroup.add(mesh);
            }
            const side = Math.random() > 0.5 ? 1 : -1;
            const dist = 30 + Math.random() * 50; 
            cloudGroup.position.set((side * dist) + (Math.random() * 20), y + (Math.random() * 30 - 15), z);
            scene.add(cloudGroup);
            clouds.push(cloudGroup);
        }

        function startGame() {
            if (playerName.length < 3) return;

            gameState.isPlaying = true;
            gameState.isJumping = false;
            gameState.score = 0;
            gameState.maxRowGenerated = 0;
            gameState.playerPos = { x: 0, y: 0, z: 0 };
            gameState.voidY = -CONFIG.cubeSize * 3; 
            gameState.currentVoidSpeed = CONFIG.baseVoidSpeed;
            
            scoreEl.innerText = "0";
            scoreEl.classList.remove('hidden');
            voidWarningEl.style.opacity = "1";
            hintsEl.classList.remove('hidden');
            menuScreen.classList.add('hidden'); // Hide menu

            map.forEach(data => { scene.remove(data.mesh); if(data.prop) scene.remove(data.prop); });
            map.clear();
            fallingBlocks.forEach(obj => scene.remove(obj));
            fallingBlocks = [];
            clouds.forEach(c => scene.remove(c));
            clouds = [];
            particles.forEach(p => scene.remove(p.mesh));
            particles = [];

            player.position.set(0, 0, 0);
            player.rotation.set(0, 0, 0);
            player.visible = true;
            resetIdleTimer();

            for (let x = -2; x <= 2; x++) { for (let z = -2; z <= 2; z++) { createTile(x, 0, z); } }
            for (let i = 1; i < 35; i++) { generateRow(i); }
        }

        function generateRow(rowZ) {
            const z = -rowZ; 
            const centerOffset = Math.floor(Math.sin(rowZ * 0.5) * 2);
            const y = Math.floor(rowZ / 2);
            const pathWidth = 2;

            for (let x = -5; x <= 5; x++) {
                const dist = Math.abs(x - centerOffset);
                if (dist <= pathWidth) {
                    let hasProp = (dist === pathWidth && Math.random() > 0.7);
                    createTile(x, y, z, hasProp);
                }
            }
            if (rowZ % 2 === 0 && Math.random() > 0.2) {
                const cloudY = (y * CONFIG.cubeSize);
                const cloudZ = z * CONFIG.cubeSize;
                createCloud(cloudY, cloudZ);
            }
            gameState.maxRowGenerated = rowZ;
        }

        function getTileColor(y) {
            if (y < 15) return 0x8BC34A; 
            else if (y < 40) return 0xD88C4D; 
            else if (y < 70) return 0x757575; 
            else return 0xFFFFFF; 
        }

        function createTile(x, y, z, hasProp = false) {
            const s = CONFIG.cubeSize;
            const geometry = new THREE.BoxGeometry(s, s, s);
            const colorHex = getTileColor(y);
            const material = new THREE.MeshStandardMaterial({ color: colorHex });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x * s, (y * s) - (s/2), z * s);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            let propMesh = null;
            if (hasProp) {
                const treeGroup = new THREE.Group();
                if (y < 50) {
                    const trunkGeo = new THREE.BoxGeometry(s/3, s, s/3);
                    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4E342E });
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.y = s/2;
                    treeGroup.add(trunk);
                    const leafGeo = new THREE.BoxGeometry(s*0.8, s*0.8, s*0.8);
                    const leafColor = y < 15 ? 0x2E7D32 : 0xFF9800; 
                    const leafMat = new THREE.MeshStandardMaterial({ color: leafColor });
                    const leaf = new THREE.Mesh(leafGeo, leafMat);
                    leaf.position.y = s;
                    treeGroup.add(leaf);
                } else {
                    const rockGeo = new THREE.DodecahedronGeometry(s/2);
                    const rockMat = new THREE.MeshStandardMaterial({ color: 0xA0E0FF, flatShading: true });
                    const rock = new THREE.Mesh(rockGeo, rockMat);
                    rock.position.y = s/2;
                    treeGroup.add(rock);
                }
                treeGroup.position.set(x * s, (y * s) - (s/2), z * s);
                treeGroup.castShadow = true;
                scene.add(treeGroup);
                propMesh = treeGroup;
            }
            map.set(`${x},${z}`, { y: y, hasProp: hasProp, mesh: mesh, prop: propMesh });
        }

        function movePlayer(dirX) {
            if (gameState.isJumping) return;
            const currentPos = gameState.playerPos;
            const nextX = currentPos.x + dirX;
            const nextZ = currentPos.z - 1;
            const targetBlock = map.get(`${nextX},${nextZ}`);
            let isBlocked = false;
            let targetY = -100;
            if (targetBlock) {
                targetY = targetBlock.y;
                if (targetBlock.hasProp) isBlocked = true;
                if (targetY - currentPos.y > 1) isBlocked = true;
            }
            gameState.isJumping = true;
            jumpStartTime = performance.now();
            jumpStartPos.copy(player.position);
            const s = CONFIG.cubeSize;
            if (isBlocked) {
                jumpTargetPos.set((currentPos.x * s) + (dirX * s * 0.5), (currentPos.y * s), (currentPos.z * s) - (s * 0.5));
                gameState.failedMove = true;
            } else {
                gameState.failedMove = false;
                gameState.playerPos = { x: nextX, y: targetY, z: nextZ };
                const landY = (targetBlock) ? targetBlock.y : -5;
                jumpTargetPos.set(nextX * s, landY * s, nextZ * s);
                if (targetBlock) {
                    gameState.score++;
                    scoreEl.innerText = gameState.score;
                    if (Math.abs(nextZ) > gameState.maxRowGenerated - CONFIG.renderDistance) {
                        generateRow(gameState.maxRowGenerated + 1);
                    }
                }
            }
            const targetRot = (dirX > 0) ? -Math.PI/4 : Math.PI/4;
            player.rotation.y = targetRot;
        }

        function gameOver() {
            if (!gameState.isPlaying) return;
            gameState.isPlaying = false;
            voidWarningEl.style.opacity = "0";
            const currentScore = gameState.score;
            if (currentScore > gameState.highScore) {
                saveScoreToHell(currentScore);
            }
            startBtn.innerText = "MAIN LAGI";
            menuScreen.classList.remove('hidden');
            scoreEl.classList.add('hidden');
            hintsEl.classList.add('hidden');
            // Show start button and hide input again
            switchMode(false);
        }

        function updateSkyColor() {
            const score = gameState.score;
            let targetColor = new THREE.Color(0xA2D9FF);
            let fogDistStart = 200;
            let fogDistEnd = 600;
            if (score > 30 && score < 80) {
                const t = (score - 30) / 50;
                targetColor.lerp(new THREE.Color(0xFF8866), t);
            } else if (score >= 80) {
                const t = Math.min((score - 80) / 50, 1);
                const sunset = new THREE.Color(0xFF8866);
                const night = new THREE.Color(0x220033);
                targetColor = sunset.lerp(night, t);
                fogDistStart = 100;
                fogDistEnd = 400;
            }
            scene.background.lerp(targetColor, 0.05);
            scene.fog.color.lerp(targetColor, 0.05);
            scene.fog.near += (fogDistStart - scene.fog.near) * 0.01;
            scene.fog.far += (fogDistEnd - scene.fog.far) * 0.01;
        }

        function animate(time) {
            animationId = requestAnimationFrame(animate);
            const delta = (time - lastTime) / 1000;
            lastTime = time;

            bgParticles.forEach(p => {
                p.mesh.position.y += p.speedY;
                p.mesh.rotation.x += p.speedRot;
                if (p.mesh.position.y > 300) p.mesh.position.y = -300;
            });

            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.life -= delta * 2; 
                p.mesh.position.addScaledVector(p.vel, delta);
                p.mesh.scale.setScalar(p.life);
                p.mesh.rotation.x += delta;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            clouds.forEach(c => {
                c.position.y += Math.sin(time * 0.001 + c.position.x) * 0.05; 
            });

            if (!gameState.isPlaying) {
                if (player) {
                    const timeSinceInput = time - lastInputTime;
                    if (timeSinceInput > 3000) { 
                        player.rotation.y = Math.sin(time * 0.005) * 0.3;
                        player.scale.y = 1 + Math.sin(time * 0.005) * 0.02;
                    } else {
                        player.rotation.y = player.rotation.y * 0.9;
                    }
                }
                updateSkyColor(); 
                return;
            }

            updateSkyColor();

            gameState.currentVoidSpeed = CONFIG.baseVoidSpeed + (gameState.score * CONFIG.voidSpeedMultiplier);
            gameState.voidY += gameState.currentVoidSpeed * delta;
            voidMesh.position.y = gameState.voidY - 50; 
            if (player.position.y < gameState.voidY) gameOver();

            for (const [key, value] of map.entries()) {
                const blockWorldY = (value.y * CONFIG.cubeSize) - (CONFIG.cubeSize/2); 
                if (blockWorldY < gameState.voidY + 5) { 
                    fallingBlocks.push({ mesh: value.mesh, prop: value.prop, velY: 0 });
                    map.delete(key);
                }
            }
            for (let i = clouds.length - 1; i >= 0; i--) {
                if (clouds[i].position.y < gameState.voidY - 200) {
                    scene.remove(clouds[i]);
                    clouds.splice(i, 1);
                }
            }
            for (let i = fallingBlocks.length - 1; i >= 0; i--) {
                const obj = fallingBlocks[i];
                obj.velY -= 50 * delta; 
                obj.mesh.position.y += obj.velY * delta;
                obj.mesh.rotation.x += delta;
                obj.mesh.rotation.z += delta;
                if (obj.prop) {
                    obj.prop.position.y += obj.velY * delta;
                    obj.prop.rotation.x += delta;
                }
                if (obj.mesh.position.y < gameState.voidY - 200) {
                    scene.remove(obj.mesh);
                    if(obj.prop) scene.remove(obj.prop);
                    fallingBlocks.splice(i, 1);
                }
            }

            if (gameState.isJumping) {
                const elapsed = (time - jumpStartTime) / 1000;
                const progress = Math.min(elapsed / CONFIG.jumpDuration, 1);
                if (gameState.failedMove) {
                     if (progress < 0.5) player.position.lerpVectors(jumpStartPos, jumpTargetPos, progress * 2);
                     else player.position.lerpVectors(jumpTargetPos, jumpStartPos, (progress - 0.5) * 2);
                } else {
                    player.position.lerpVectors(jumpStartPos, jumpTargetPos, progress);
                }
                const jumpY = Math.sin(progress * Math.PI) * CONFIG.jumpHeight;
                player.position.y += jumpY;
                if (progress >= 1) {
                    gameState.isJumping = false;
                    if (gameState.failedMove) {
                        player.position.copy(jumpStartPos);
                    } else {
                        const s = CONFIG.cubeSize;
                        const landY = gameState.playerPos.y * s;
                        if (jumpTargetPos.y < -2 * s) gameOver();
                        else {
                            player.position.y = landY;
                            createDust(player.position.x, player.position.y - s/2, player.position.z);
                        }
                    }
                }
            } else {
                player.scale.y = 1 + Math.sin(time * 0.005) * 0.05;
                player.scale.x = 1 - Math.sin(time * 0.005) * 0.02;
                player.scale.z = 1 - Math.sin(time * 0.005) * 0.02;
            }

            if (player) {
                const offset = new THREE.Vector3(100, 100, 100);
                const targetCamPos = player.position.clone().add(offset);
                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(player.position);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 80;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
